[package]
name = "changuito_escrow"
version = "0.1.0"
description = "Escrow for a grocery basket paid in USDC on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "changuito_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# cfgs Anchor's macros emit; declared so `unexpected_cfgs` stays quiet.
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Every anchor-* crate on the same version, and the CLI to match.
anchor-lang = { version = "=1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.1", features = ["token"] }

solana-sha256-hasher = "=3.1.0"

[dev-dependencies]
litesvm = "=0.18.1"
solana-account = "4.3.0"
solana-address = "~2.7.0"
solana-clock = "~3.2.0"
solana-instruction = "~3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
