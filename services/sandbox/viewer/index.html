<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIA checkout / Pago en DIA</title>
<style>
html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:#111827;color:#fff}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}
button,input,select{font:inherit}
header button,header input{padding:8px;border:1px solid #9ca3af;border-radius:4px;background:#fff;color:#111827}
header input{width:140px}
#status{flex:1}
header button,header input{cursor:pointer;min-height:44px}
#screen{flex:1;min-height:180px;overflow:auto;background:#fff}
#card-form{background:#fafaf7;color:#2a1a14;padding:12px;display:flex;flex-direction:column;gap:10px}
#card-form p{margin:0;font-size:13px;line-height:1.4;color:#4a332c}
#card-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#4a332c;min-width:0}
#card-form input,#card-form select,#apply-card{
  font-size:16px;color:#2a1a14;background:#fff;border:1px solid rgba(42,26,20,.22);
  border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
#card-form input:focus-visible,#card-form select:focus-visible,#apply-card:focus-visible,
header button:focus-visible,header input:focus-visible{outline:2px solid #f4b942;outline-offset:2px}
.kinds{display:flex;gap:8px}
.kinds label{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 12px;border:1px solid rgba(42,26,20,.22);border-radius:999px;background:#fff;
  font-size:14px;color:#2a1a14;cursor:pointer}
.kinds label:has(input:checked){background:#f4b942;border-color:#f4b942;font-weight:700}
.kinds input{width:16px;height:16px;min-height:0;padding:0;accent-color:#2a1a14}
.expiry{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr);gap:10px}
.err{font-size:12px;line-height:1.35;color:#7a2e12}
#apply-card{font-weight:700;border:2px solid transparent;border-radius:999px;background:#f4b942;color:#2a1a14;cursor:pointer}
#apply-card:disabled{opacity:.45;cursor:not-allowed}
#card-status:empty{display:none}
#card-status.ok{color:#1a7f4b}
@media(max-width:520px){
  .expiry{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .expiry label:last-child{grid-column:1 / -1}
}
</style>
<header>
  <span id="status" role="status">Conectando / Connecting…</span>
  <button id="reconnect" type="button">Reconectar / Reconnect</button>
  <label>Teclado / Keyboard <input id="keyboard" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Teclado remoto / Remote keyboard"></label>
  <button id="tab" type="button">Tab ↹</button>
  <button id="backspace" type="button">⌫</button>
</header>
<form id="card-form" autocomplete="on">
  <p id="card-hint">Mes y año se eligen acá. El teclado de arriba es para el captcha y la verificación.</p>
  <div class="kinds" id="kinds" role="radiogroup" aria-label="Tipo de tarjeta">
    <label><input type="radio" name="kind" value="debit" checked><span id="lbl-debit">Débito</span></label>
    <label><input type="radio" name="kind" value="credit"><span id="lbl-credit">Crédito</span></label>
  </div>
  <label>
    <span id="lbl-pan">Número de tarjeta</span>
    <input id="pan" name="pan" inputmode="numeric" autocomplete="cc-number" maxlength="23" spellcheck="false" aria-describedby="pan-error" aria-invalid="false">
    <span id="pan-error" class="err" hidden></span>
  </label>
  <label>
    <span id="lbl-holder">Nombre y apellido</span>
    <input id="holder" name="holder" autocomplete="cc-name" maxlength="80" autocapitalize="words" aria-describedby="holder-error" aria-invalid="false">
    <span id="holder-error" class="err" hidden></span>
  </label>
  <div class="expiry">
    <label>
      <span id="lbl-month">Mes</span>
      <select id="month" name="month" autocomplete="cc-exp-month" aria-describedby="month-error" aria-invalid="false"></select>
      <span id="month-error" class="err" hidden></span>
    </label>
    <label>
      <span id="lbl-year">Año</span>
      <select id="year" name="year" autocomplete="cc-exp-year" aria-describedby="year-error" aria-invalid="false"></select>
      <span id="year-error" class="err" hidden></span>
    </label>
    <label>
      <span id="lbl-cvv">Código de seguridad</span>
      <input id="cvv" name="cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" aria-describedby="cvv-error" aria-invalid="false">
      <span id="cvv-error" class="err" hidden></span>
    </label>
  </div>
  <p id="card-status" role="status"></p>
  <button id="apply-card" type="button">Cargar en Día</button>
</form>
<div id="screen" aria-label="DIA checkout / Pago en DIA"></div>
<script>window.viewerParents=__PARENTS__;</script>
<script type="module" src="/viewer/viewer.js"></script>
</html>
